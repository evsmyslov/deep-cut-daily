<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192323">
<meta name="description" content="A daily open-answer quiz. Find the facts that others overlook. Play in English or Russian.">
<title>Deep Cut Daily</title>
<link rel="icon" href="art/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="questions.js"></script>
<script defer src="game.js"></script>
</head>
<body>
<header class="top"><div class="shell top-inner">
  <a id="home" class="brand" href="./"><img src="art/mark.png" width="25" height="25" alt=""><span>DEEP CUT</span><small>DAILY</small></a>
  <nav id="nav"><button id="rules" data-text="rules"></button><button id="stats" data-text="stats"></button><button id="lang" aria-label="Switch language"></button></nav>
</div></header>
<main class="shell">
  <div class="daily-bar"><p><span class="live" aria-hidden="true"></span><span id="edition"></span></p><button id="archive" data-text="archive"></button></div>
  <section class="machine" id="machine"><div id="stage"></div><div class="machine-footer"><span id="footer-mode"></span><span id="countdown"></span></div></section>
  <section class="levels" id="levels"></section>
</main>
<footer class="bottom shell"><span>DEEP CUT DAILY</span><span data-text="reset"></span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><form method="dialog"><button id="close" aria-label="Close dialog">×</button></form></div><div id="modal-content"></div></dialog>
<template id="intro">
  <div class="intro">
    <div class="intro-art" aria-hidden="true"></div>
    <div class="intro-content">
      <p class="label" data-text="daily"></p>
      <h1 id="topic" data-text="hero"></h1>
      <p id="pitch" data-text="pitch"></p>
      <p id="challenge" class="challenge" data-text="challenge" hidden></p>
      <button id="start" class="primary"></button>
    </div>
  </div>
</template>
<template id="question">
  <section class="round">
    <div class="round-meta"><p class="label" id="level"></p><p id="round-score"></p></div>
    <div class="progress" id="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="category label" id="category"></p>
    <h1 id="prompt"></h1>
    <form id="answer-form"><label class="sr-only" for="answer" data-text="answerLabel"></label><input id="answer" maxlength="100" autocomplete="off" required><button class="primary" data-text="submit"></button></form>
    <button class="quiet" id="skip" data-text="skip"></button>
    <div id="feedback" hidden><p id="verdict" role="status"></p><p id="sample"></p><button class="primary" id="next"></button></div>
  </section>
</template>
<template id="results">
  <section class="round results">
    <p class="label" id="finished-topic"></p>
    <h1 data-text="finished"></h1>
    <p class="score" id="total"></p>
    <p id="badge" class="challenge"></p>
    <p id="comparison" hidden></p>
    <ol id="recap"></ol>
    <div class="actions"><button class="primary" id="share" data-text="share"></button><button class="quiet" id="today" data-text="todayButton"></button></div>
    <p id="share-status" role="status"></p>
  </section>
</template>
</body>
</html>
