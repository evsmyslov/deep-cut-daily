<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192323">
<meta name="description" content="A daily open-answer quiz. Find the facts that others overlook. Play in English or Russian.">
<title>Rare Below</title>
<link rel="icon" href="art/mark.png">
<link rel="stylesheet" href="style.css?v=expedition-scores">
<script defer src="catalog-data.js"></script>
<script defer src="question-bank.js?v=full-recap"></script>
<script defer src="everyday-questions.js?v=everyday"></script>
<script defer src="theme-questions.js?v=daily-20261124"></script>
<script defer src="pack-questions.js?v=expedition-scores"></script>
<script defer src="answer-expansions.js?v=20261125b"></script>
<script defer src="open-questions.js?v=expedition-scores"></script>
<script defer src="answer-notes.js?v=expedition-scores"></script>
<script defer src="suggestions.js?v=submit-correction"></script>
<script defer src="live-client.js?v=submit-correction"></script>
<script defer src="company.js?v=round-chart"></script>
<script defer src="audio.js?v=expedition-scores"></script>
<script defer src="friends.js?v=round-chart"></script>
<script defer src="mine-scene.js?v=round-chart"></script>
<script defer src="game.js?v=submit-correction"></script>
</head>
<body>
<header class="top"><div class="shell top-inner">
  <a id="home" class="brand" href="./"><img src="art/mark.png" width="25" height="25" alt=""><span>RARE BELOW</span></a>
  <nav id="nav"><button id="rules" data-text="rules"></button><button id="stats" data-text="stats"></button><button id="sound" data-text="sound" aria-haspopup="dialog"></button><button id="lang" aria-label="Switch language"></button></nav>
</div></header>
<main class="shell">
  <div class="daily-bar">
    <p><span class="live" aria-hidden="true"></span><span id="edition"></span></p>
    <details id="game-menu" class="game-menu">
      <summary id="game-menu-label"><span class="menu-lines" aria-hidden="true"></span><span class="sr-only" data-text="menu"></span><span id="menu-unread" hidden></span></summary>
      <div class="mode-buttons">
        <button id="packs" data-text="pack" aria-haspopup="dialog"></button>
        <button id="company" data-text="company" aria-haspopup="dialog"></button>
        <button id="endless" data-text="endless" aria-haspopup="dialog"></button>
        <button id="duel" data-text="duel" aria-haspopup="dialog"></button>
        <button id="friends" aria-haspopup="dialog"><span data-text="friends"></span><span id="friend-unread" hidden></span></button>
        <button id="archive" data-text="archive" aria-haspopup="dialog"></button>
      </div>
    </details>
  </div>
  <section class="machine" id="machine">
    <div class="world" aria-hidden="true">
      <canvas id="mine-scene"></canvas>
      <div class="world-shade"></div>
    </div>
    <div class="mission-hud">
      <div class="readout"><span data-text="depth"></span><strong id="depth" aria-live="polite"></strong></div>
      <div class="readout hud-progress"><span id="hud-step"></span><div class="progress" id="progress" aria-hidden="true"></div></div>
      <div class="readout hud-score"><span data-text="scoreLabel"></span><strong id="hud-score"></strong><div class="hud-duel-score" id="hud-duel-score" hidden><span data-text="friendSeat"></span> <b id="hud-rival"></b></div></div>
    </div>
    <div class="depth-map" id="depth-map"></div>
    <div id="stage"></div>
    <div class="machine-footer"><span id="footer-mode"></span><span id="countdown"></span></div>
  </section>
  <section class="levels" id="levels"></section>
</main>
<footer class="bottom shell"><span>RARE BELOW</span><span data-text="reset"></span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><form method="dialog"><button id="close" aria-label="Close dialog">×</button></form></div><div id="modal-content"></div></dialog>
<dialog id="duel-modal" aria-labelledby="duel-title">
  <div class="dialog-head"><h2 id="duel-title" data-text="live"></h2><button id="duel-close" type="button" aria-label="Close dialog">×</button></div>
  <div id="duel-body"></div>
</dialog>
<template id="intro">
  <div class="intro">
    <div class="intro-content">
      <p class="label" data-text="daily"></p>
      <h1 id="topic" data-text="hero"></h1>
      <p id="pitch" data-text="pitch"></p>
      <p id="challenge" class="challenge" data-text="challenge" hidden></p>
      <div class="actions"><button id="start" class="primary"></button><button id="invite" class="quiet" data-text="invite" hidden></button></div><p id="lobby-status" role="status"></p>
    </div>
  </div>
</template>
<template id="question">
  <section class="round">
    <p class="category label" id="category"></p>
    <h1 id="prompt"></h1>
    <form id="answer-form"><label class="sr-only" for="answer" data-text="answerLabel"></label><div class="timer" id="timer" aria-hidden="true"></div><input id="answer" maxlength="100" autocomplete="off" required><button class="primary" data-text="submit"></button></form>
    <div class="answer-suggestions" id="suggestions" role="group" hidden></div>
    <div class="actions question-actions"><button class="quiet" id="skip" data-text="skip"></button><button class="quiet" id="finish-endless" data-text="stopRun" hidden></button><span id="check-status" role="status"></span><a class="direct-duel" id="match-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a></div>
    <div id="feedback" hidden><p id="verdict" role="status"></p><p id="answer-note" class="answer-note" hidden></p><p id="rival-verdict" class="rival-answer" hidden></p><p id="sample"></p><p class="arrival" id="arrival"></p><div id="company-board" hidden></div><button class="primary" id="next"></button></div>
  </section>
</template>
<template id="results">
  <section class="round results">
    <p class="label" id="finished-topic"></p>
    <h1 data-text="finished"></h1>
    <p class="score" id="total"></p>
    <p id="badge" class="challenge"></p>
    <p id="comparison" role="status" hidden></p><button class="quiet" id="refresh-duel" data-text="refresh" hidden></button>
    <div id="company-results" hidden></div>
    <section id="score-chart" aria-labelledby="score-chart-title" hidden>
      <div class="score-chart-heading"><h2 id="score-chart-title" data-text="scoreChart"></h2><strong id="score-self"></strong></div>
      <p id="score-peers" role="status"></p>
      <div id="score-plot" hidden>
        <div class="score-plot-graph"><div id="score-bars"></div><div id="score-marker" aria-hidden="true"></div></div>
        <div id="score-axis" aria-hidden="true"></div>
        <p id="score-band" aria-live="polite"></p>
      </div>
    </section>
    <section id="round-review" aria-labelledby="recap-title" hidden><h2 id="recap-title" data-text="recapTitle"></h2><ol id="recap"></ol></section>
    <div class="actions"><button class="primary" id="share" data-text="share"></button><button class="quiet" id="today" data-text="todayButton"></button></div>
    <p id="share-status" role="status"></p>
    <p id="answer-source" class="answer-source" role="status"></p>
  </section>
</template>
<template id="duel-menu">
  <div class="duel-menu">
    <button class="primary" id="duel-create" data-text="createRoom"></button>
    <form class="join-form" id="duel-join">
      <label for="room-code-input" data-text="roomCode"></label>
      <div class="join-controls">
        <input id="room-code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="19" required>
        <button class="quiet" data-text="joinCode"></button>
      </div>
    </form>
    <a class="direct-duel" id="duel-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a>
    <p id="duel-menu-notice" role="status"></p>
  </div>
</template>
<template id="live-lobby">
  <section class="live-lobby">
    <p id="live-status" class="challenge" role="status"></p>
    <div class="live-seats" id="live-seats">
      <div><span data-text="yourSeat"></span><strong id="own-ready"></strong></div>
      <div><span data-text="friendSeat"></span><strong id="friend-ready"></strong></div>
    </div>
    <label class="sr-only" for="live-url" data-text="invite"></label>
    <div class="live-url">
      <input id="live-url" readonly inputmode="none">
      <button class="quiet" id="live-copy" data-text="invite"></button>
    </div>
    <p id="live-room-code"><span data-text="roomCode"></span> <code id="current-room-code"></code></p>
    <div class="actions">
      <button class="primary" id="live-ready" data-text="ready"></button>
      <button class="quiet" id="live-retry" data-text="retryLive" hidden></button>
      <button class="quiet" id="live-back" data-text="duelMenu"></button>
      <a class="direct-duel" id="live-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
    <p id="live-notice" role="status"></p>
  </section>
</template>
<template id="company-menu">
  <div class="company-menu">
    <p data-text="companyIntro"></p>
    <label><span data-text="companyName"></span><input id="company-name" maxlength="24" autocomplete="off"></label>
    <form id="company-create" class="join-form">
      <div class="company-options">
        <label><span data-text="companyTheme"></span><select id="company-pack"></select></label>
        <label><span data-text="companyRoundCount"></span><select id="company-rounds"><option>5</option><option selected>7</option><option>10</option></select></label>
      </div>
      <button class="primary" data-text="createRoom"></button>
    </form>
    <form class="join-form" id="company-join">
      <label for="company-code" data-text="roomCode"></label>
      <div class="join-controls"><input id="company-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" required><button class="quiet" data-text="joinCode"></button></div>
    </form>
    <p id="company-notice" role="status"></p>
  </div>
</template>
<template id="company-lobby">
  <section class="live-lobby">
    <p id="live-status" class="challenge" role="status"></p>
    <p id="company-settings"></p>
    <div id="company-lobby-roster"></div>
    <div class="live-url">
      <input id="live-url" readonly inputmode="none">
      <button class="quiet" id="live-copy" data-text="invite"></button>
    </div>
    <p id="live-room-code"><span data-text="roomCode"></span> <code id="current-room-code"></code></p>
    <form id="company-rename" class="join-form">
      <label for="company-lobby-name" data-text="companyName"></label>
      <div class="join-controls"><input id="company-lobby-name" maxlength="24" autocomplete="off"><button class="quiet" data-text="companySaveName"></button></div>
    </form>
    <div class="actions">
      <button class="primary" id="company-start" data-text="companyStart" hidden></button>
      <button class="quiet" id="live-retry" data-text="retryLive" hidden></button>
      <button class="quiet" id="company-back" data-text="company"></button>
      <a class="direct-duel" id="live-direct" data-text="directCompany" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
    <p id="live-notice" role="status"></p>
  </section>
</template>
</body>
</html>
