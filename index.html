<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192323">
<meta name="description" content="A daily open-answer quiz. Find the facts that others overlook. Play in English or Russian.">
<title>Rare Below</title>
<link rel="icon" href="art/mark.png">
<link rel="stylesheet" href="style.css?v=miner-poses">
<script defer src="catalog-data.js"></script>
<script defer src="open-questions.js?v=expedition-modes"></script>
<script defer src="suggestions.js?v=live2"></script>
<script defer src="live-client.js?v=direct-duels"></script>
<script defer src="audio.js?v=miner-motion"></script>
<script defer src="friends.js?v=direct-duels"></script>
<script defer src="game.js?v=miner-poses"></script>
</head>
<body>
<header class="top"><div class="shell top-inner">
  <a id="home" class="brand" href="./"><img src="art/mark.png" width="25" height="25" alt=""><span>RARE BELOW</span></a>
  <nav id="nav"><button id="rules" data-text="rules"></button><button id="stats" data-text="stats"></button><button id="sound" data-text="sound" aria-haspopup="dialog"></button><button id="lang" aria-label="Switch language"></button></nav>
</div></header>
<main class="shell">
  <div class="daily-bar"><p><span class="live" aria-hidden="true"></span><span id="edition"></span></p><div class="mode-buttons"><button id="endless" data-text="endless" aria-haspopup="dialog"></button><button id="duel" data-text="duel" aria-haspopup="dialog"></button><button id="friends" aria-haspopup="dialog"><span data-text="friends"></span><span id="friend-unread" hidden></span></button><button id="archive" data-text="archive"></button></div></div>
  <section class="machine" id="machine">
    <div class="world" aria-hidden="true">
      <div class="world-track" id="world-track"></div>
      <div class="world-shade"></div>
      <div class="miner" id="miner"><span class="miner-body"></span></div>
    </div>
    <div class="mission-hud">
      <div class="readout"><span data-text="depth"></span><strong id="depth" aria-live="polite"></strong></div>
      <div class="readout hud-progress"><span id="hud-step"></span><div class="progress" id="progress" aria-hidden="true"></div></div>
      <div class="readout hud-score"><span data-text="scoreLabel"></span><strong id="hud-score"></strong></div>
    </div>
    <div class="depth-map" id="depth-map"></div>
    <div id="stage"></div>
    <div class="machine-footer"><span id="footer-mode"></span><span id="countdown"></span></div>
  </section>
  <section class="levels" id="levels"></section>
</main>
<footer class="bottom shell"><span>RARE BELOW</span><span data-text="reset"></span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><form method="dialog"><button id="close" aria-label="Close dialog">×</button></form></div><div id="modal-content"></div></dialog>
<dialog id="duel-modal" aria-labelledby="duel-title">
  <div class="dialog-head"><h2 id="duel-title" data-text="live"></h2><button id="duel-close" type="button" aria-label="Close dialog">×</button></div>
  <div id="duel-body"></div>
</dialog>
<template id="intro">
  <div class="intro">
    <div class="intro-content">
      <p class="label" data-text="daily"></p>
      <h1 id="topic" data-text="hero"></h1>
      <p id="pitch" data-text="pitch"></p>
      <p id="challenge" class="challenge" data-text="challenge" hidden></p>
      <div class="actions"><button id="start" class="primary"></button><button id="invite" class="quiet" data-text="invite" hidden></button></div><p id="lobby-status" role="status"></p>
    </div>
  </div>
</template>
<template id="question">
  <section class="round">
    <p class="category label" id="category"></p>
    <h1 id="prompt"></h1>
    <form id="answer-form"><label class="sr-only" for="answer" data-text="answerLabel"></label><div class="timer" id="timer" aria-hidden="true"></div><input id="answer" maxlength="100" autocomplete="off" required><button class="primary" data-text="submit"></button></form>
    <div class="answer-suggestions" id="suggestions" hidden></div>
    <div class="actions question-actions"><button class="quiet" id="skip" data-text="skip"></button><button class="quiet" id="finish-endless" data-text="stopRun" hidden></button><span id="check-status" role="status"></span><a class="direct-duel" id="match-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a></div>
    <div id="feedback" hidden><p id="verdict" role="status"></p><p id="sample"></p><p class="arrival" id="arrival"></p><button class="primary" id="next"></button></div>
  </section>
</template>
<template id="results">
  <section class="round results">
    <p class="label" id="finished-topic"></p>
    <h1 data-text="finished"></h1>
    <p class="score" id="total"></p>
    <p id="badge" class="challenge"></p>
    <p id="comparison" role="status" hidden></p><button class="quiet" id="refresh-duel" data-text="refresh" hidden></button>
    <ol id="recap"></ol>
    <div class="actions"><button class="primary" id="share" data-text="share"></button><button class="quiet" id="today" data-text="todayButton"></button></div>
    <p id="share-status" role="status"></p>
    <p id="answer-source" class="answer-source" role="status"></p>
  </section>
</template>
<template id="duel-menu">
  <div class="duel-menu">
    <button class="primary" id="duel-create" data-text="createRoom"></button>
    <form class="join-form" id="duel-join">
      <label for="room-code-input" data-text="roomCode"></label>
      <div class="join-controls">
        <input id="room-code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="19" required>
        <button class="quiet" data-text="joinCode"></button>
      </div>
    </form>
    <a class="direct-duel" id="duel-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a>
    <p id="duel-menu-notice" role="status"></p>
  </div>
</template>
<template id="live-lobby">
  <section class="live-lobby">
    <p id="live-status" class="challenge" role="status"></p>
    <div class="live-seats" id="live-seats">
      <div><span data-text="yourSeat"></span><strong id="own-ready"></strong></div>
      <div><span data-text="friendSeat"></span><strong id="friend-ready"></strong></div>
    </div>
    <label class="sr-only" for="live-url" data-text="invite"></label>
    <div class="live-url">
      <input id="live-url" readonly inputmode="none">
      <button class="quiet" id="live-copy" data-text="invite"></button>
    </div>
    <p id="live-room-code"><span data-text="roomCode"></span> <code id="current-room-code"></code></p>
    <div class="actions">
      <button class="primary" id="live-ready" data-text="ready"></button>
      <button class="quiet" id="live-retry" data-text="retryLive" hidden></button>
      <button class="quiet" id="live-back" data-text="duelMenu"></button>
      <a class="direct-duel" id="live-direct" data-text="directDuel" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
    <p id="live-notice" role="status"></p>
  </section>
</template>
</body>
</html>
